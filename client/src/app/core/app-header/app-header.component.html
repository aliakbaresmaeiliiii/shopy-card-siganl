@if (showMenu) {
  <header class="app-header">
    <nav class="nav-inner">
      <a routerLink="/welcome" class="brand">{{ pageTitle }}</a>
      <ul class="nav-links">
        @for (item of menuItems; track item.id) {
          <li>
            <a
              class="nav-link"
              [routerLink]="item.routerLink"
              routerLinkActive="nav-link--active"
              [routerLinkActiveOptions]="{ exact: item.routerLink === '/welcome' }"
            >
              <span class="nav-link-text">{{ item.name }}</span>
              @if (item.name === "Cart" && cartCount() > 0) {
                <span class="nav-badge">{{ cartCount() }}</span>
              }
            </a>
          </li>
        }
      </ul>
      <div class="nav-actions">
        <button type="button" class="user-trigger" [matMenuTriggerFor]="menu" aria-label="Account menu">
          <svg class="user-trigger-icon nav-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
          </svg>
          <span class="user-trigger-label">Account</span>
          <svg class="nav-icon user-trigger-chevron" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/>
          </svg>
        </button>
        <mat-menu #menu="matMenu" panelClass="user-menu" xPosition="before" yPosition="below">
          <div class="user-menu-header">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
            <span>Aliakbar Esmaeili</span>
          </div>
          <button mat-menu-item (click)="favorite()">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
            <span>My favorites</span>
          </button>
          <button mat-menu-item routerLink="/login">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            <span>Log out</span>
          </button>
        </mat-menu>
      </div>
    </nav>
  </header>
}
