<div class="cart-list">
  @if (cartItems().length) {
    <div class="cart-list__header">
      <span class="cart-list__header-product">Product</span>
      <span class="cart-list__header-price">Price</span>
      <span class="cart-list__header-qty">Quantity</span>
      <span class="cart-list__header-total">Total</span>
    </div>

    <ul class="cart-list__items">
      @for (cartItem of cartItems(); track cartItem.product.id) {
        <li class="cart-list__item">
          <sw-cart-item [cartItem]="cartItem" />
        </li>
      }
    </ul>
  } @else {
    <div class="cart-list__empty">
      <div class="cart-list__empty-icon-wrap">
        <svg class="cart-list__empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
        </svg>
      </div>
      <h2 class="cart-list__empty-title">Your cart is empty</h2>
      <p class="cart-list__empty-text">Add items from the store to get started.</p>
      <a routerLink="/welcome" class="cart-list__empty-cta">Continue shopping</a>
    </div>
  }
</div>
