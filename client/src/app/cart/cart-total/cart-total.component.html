@if (cartItems().length) {
  <div class="max-w-md mx-auto bg-white rounded-2xl shadow-lg border border-gray-200 overflow-hidden">

    <!-- Header -->
    <div class="px-6 py-4 bg-gradient-to-r from-indigo-600 to-blue-600 text-white">
      <h3 class="text-lg font-semibold tracking-wide">Cart Total</h3>
    </div>

    <!-- Body -->
    <div class="p-6 space-y-4">

      <!-- Subtotal -->
      <div class="flex justify-between text-gray-700">
        <span>Subtotal:</span>
        <span>{{ subTotal() | currency }}</span>
      </div>

      <!-- Delivery -->
      <div class="flex justify-between text-gray-700">
        <span>Delivery:</span>
        @if (deliveryFee()) {
          <span>{{ deliveryFee() | currency }}</span>
        }
        @else {
          <span class="text-green-600 font-medium">Free</span>
        }
      </div>

      <!-- Tax -->
      <div class="flex justify-between text-gray-700">
        <span>Estimated Tax:</span>
        <span>{{ tax() | currency }}</span>
      </div>

      <hr class="border-gray-200">

      <!-- Total -->
      <div class="flex justify-between text-gray-800 text-lg font-semibold">
        <span>Total:</span>
        <span>{{ totalPrice() | currency }}</span>
      </div>

      <!-- Checkout Button -->
      <div class="text-center mt-4">
        <button (click)="checkout()"
          class="w-full px-6 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-medium transition">
          Checkout
        </button>
      </div>

    </div>
  </div>
}
