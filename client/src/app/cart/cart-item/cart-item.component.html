@if (item(); as cartItem) {
  <div class="grid grid-cols-10 gap-4 items-center">

    <!-- Product -->
    <div class="col-span-4">
      <div class="font-medium text-gray-800">
        {{ cartItem.product.productName }}
      </div>
      <div class="text-sm text-gray-400">
        {{ cartItem.product.productCode }}
      </div>
    </div>

    <!-- Price -->
    <div class="col-span-2 text-center text-gray-600">
      {{ cartItem.product.price | currency }}
    </div>

    <!-- Quantity -->
    <div class="col-span-2 flex justify-center">
      <select
        class="border border-gray-300 rounded-lg px-3 py-1.5 focus:ring-2 focus:ring-indigo-500"
        [ngModel]="cartItem.quantity"
        (ngModelChange)="onQuantitySelected($event)">
        @for (q of qtyArr; track q) {
          <option [value]="q">{{ q }}</option>
        }
      </select>
    </div>

    <!-- Total -->
    <div class="col-span-2 text-right font-semibold text-gray-800">
      {{ exPrice() | currency }}
    </div>

  </div>
}
