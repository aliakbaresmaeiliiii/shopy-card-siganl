<div class="favorites">
  <header class="favorites__header">
    <h1 class="favorites__title">My Favorites</h1>
    <p class="favorites__subtitle">Products you’ve saved for later</p>
  </header>

  @if (isLoading()) {
    <div class="favorites__loading">Loading…</div>
  } @else if (favoriteProducts().length === 0) {
    <div class="favorites__empty">
      <svg class="favorites__empty-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
      </svg>
      <p>No favorites yet. Add some from the store!</p>
    </div>
  } @else {
    <div class="favorites__grid">
      @for (product of favoriteProducts(); track product.id) {
        <pm-product-card
          [product]="product"
          [isFavorite]="true"
          (addToCart)="addToCart($event)"
          (toggleFavorite)="productService.toggle($event)"
        />
      }
    </div>
  }
</div>
